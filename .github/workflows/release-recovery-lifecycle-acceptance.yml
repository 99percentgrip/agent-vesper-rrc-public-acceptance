name: readiness-native-diagnostic
run-name: readiness-${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
jobs:
  readiness:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2025
    steps:
      - name: Preserve exact LF source bytes on disposable runner
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REF"
      - name: Prepare native Rust storage
        if: runner.os == 'Linux'
        shell: bash
        run: sh .github/prepare-rust-runner.sh
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Workflow trigger and release refusal regressions
        shell: bash
        run: python scripts/test_release_gate.py
      - name: Formatting and whitespace
        shell: bash
        run: |
          cargo fmt --all -- --check
          git diff --check
